version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    tty: true
    stdin_open: true
    restart: always
    ports:
      - "${API_PORT}:${API_PORT}"
    expose:
      - "${API_PORT}"
    env_file:
      - .env
    depends_on:
      - cache
    volumes:
      - /home/ec2-user/fit-bot-backend/uploads:/usr/src/api/uploads

  cache:
    image: redis:8.0-alpine
    restart: always
    command: redis-server --port ${REDIS_PORT}
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    expose:
      - "${REDIS_PORT}"
    volumes:
      - "${REDIS_DATA}:/data"
